services:
  - type: web
    name: meditrack-ai-api
    env: node
    region: singapore
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
