<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F5338" />
      <stop offset="50%" stop-color="#0A3D29" />
      <stop offset="100%" stop-color="#05291B" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#bgGrad)" stroke="#9EFFBF" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Glass Top Glare -->
  <path d="M 5 31 C 5 16 16 5 31 5 L 69 5 C 84 5 95 16 95 31 L 95 48 H 5 Z" fill="url(#glassGrad)" />

  <!-- Heart + ECG Line Vector -->
  <g filter="url(#glow)">
    <!-- Outer Neon Heart Outline -->
    <path
      d="M50 82 C50 82 18 60 18 36 C18 24 27 15 38 15 C45 15 48 18 50 22 C52 18 55 15 62 15 C73 15 82 24 82 36 C82 60 50 82 50 82 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Internal ECG Pulse Rhythm Line -->
    <path
      d="M28 47 H37 L41 35 L48 60 L54 40 L59 49 H72"
      fill="none"
      stroke="#9EFFBF"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
